# Profil "brut" injecté dans le prompt de l'IA pour rédiger lettres / réponses.
# Plus c'est riche, meilleures sont les réponses générées.
narrative:
  headline: "Product Growth · Product Management · Startup Founder"
  pitch: >
    Product-minded founder who shipped an AI consumer app (ZYMA) end-to-end solo
    with AI-assisted development, co-founded Spendex AI (multi-agent orchestration,
    Founders Inc / Canopy batch), and drove B2B partner-bank acquisition at Raisin.
    Strong on product discovery, monetization, experimentation and go-to-market.
  seeking: "Growth PM / Product Growth / Business Development roles at US & EU tech companies"
  # Portrait libre : écris ici, en une phrase, comment tu veux que l'IA te "voie"
  # (ton, priorités, ce qui te motive). Laissé vide = l'IA se base sur le reste.
  portrait: ""
  key_achievements:
    - "Built & launched ZYMA (iOS): 1,000+ downloads, 750+ accounts, 5.0-star rating, zero paid acquisition"
    - "Designed freemium monetization: Premium at 4.99 EUR/mo, 39.99 EUR/yr"
    - "Raisin: engaged 200+ financial institutions, 10 qualified opps, 4 banks advanced in pipeline"
    - "PredicTagAI (UC Berkeley SCET): closed partnership with Pricer's VP of Sales"
  skills:
    - "Product discovery, MVP development, roadmapping, A/B testing, monetization & pricing"
    - "AI-assisted development (Claude, Cursor, ChatGPT), automation (Zapier, Make, n8n)"
    - "HubSpot, Salesforce, Google Analytics, Tableau, advanced Excel/Sheets"
  languages: "English (fluent), French (native), Georgian (native), Russian (conversational), Spanish (basic)"
